name: Build Windows Release

on:
  push:
    branches: [ main, master, develop, claude/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ github.workspace }}/build/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}-v2
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Setup vcpkg
      shell: pwsh
      run: |
        if (-Not (Test-Path "vcpkg")) {
          Write-Host "Cloning vcpkg..."
          git clone https://github.com/microsoft/vcpkg.git
        } else {
          Write-Host "vcpkg directory exists (from cache)"
          cd vcpkg
          git pull
          cd ..
        }

        cd vcpkg
        if (-Not (Test-Path "vcpkg.exe")) {
          Write-Host "Bootstrapping vcpkg..."
          .\bootstrap-vcpkg.bat
        } else {
          Write-Host "vcpkg already bootstrapped"
        }

        # Show vcpkg version
        .\vcpkg.exe version
        cd ..

        Write-Host "Note: SDL2 dependencies will be installed automatically via vcpkg.json manifest during CMake configure"

    - name: Configure CMake
      shell: pwsh
      run: |
        $toolchainFile = "${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
        Write-Host "Toolchain file: $toolchainFile"
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$toolchainFile"

    - name: Build
      run: cmake --build build --config Release --verbose

    - name: List build output
      shell: pwsh
      run: |
        Write-Host "=== Executables ==="
        Get-ChildItem -Path build -Recurse -Filter "*.exe" | ForEach-Object { Write-Host $_.FullName }
        Write-Host "`n=== DLLs ==="
        Get-ChildItem -Path build -Recurse -Filter "*.dll" | ForEach-Object { Write-Host $_.FullName }

    - name: Package artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release-package

        # Copy executable
        if (Test-Path "build/Release/Frogger.exe") {
          Copy-Item build/Release/Frogger.exe release-package/
          Write-Host "✅ Copied Frogger.exe"
        } else {
          Write-Error "❌ Frogger.exe not found!"
          exit 1
        }

        # Copy game assets
        Copy-Item demo.jpg release-package/ -ErrorAction SilentlyContinue
        Copy-Item m0.png release-package/ -ErrorAction SilentlyContinue
        Copy-Item README.md release-package/

        # Copy DLLs from vcpkg installed location
        $vcpkgBin = "vcpkg/installed/x64-windows/bin"
        if (Test-Path $vcpkgBin) {
          Write-Host "Copying DLLs from $vcpkgBin"
          Get-ChildItem "$vcpkgBin/*.dll" | ForEach-Object {
            Copy-Item $_.FullName release-package/
            Write-Host "  ✅ $($_.Name)"
          }
        }

        # Also check build/vcpkg_installed (manifest mode location)
        $manifestBin = "build/vcpkg_installed/x64-windows/bin"
        if (Test-Path $manifestBin) {
          Write-Host "Copying DLLs from $manifestBin"
          Get-ChildItem "$manifestBin/*.dll" | ForEach-Object {
            Copy-Item $_.FullName release-package/ -Force
            Write-Host "  ✅ $($_.Name)"
          }
        }

        # List final package contents
        Write-Host "`n=== Package Contents ==="
        Get-ChildItem release-package | ForEach-Object { Write-Host "  - $($_.Name)" }

    - name: Verify package
      shell: pwsh
      run: |
        if (-Not (Test-Path "release-package/Frogger.exe")) {
          Write-Error "❌ Frogger.exe missing from package!"
          exit 1
        }

        $dllCount = (Get-ChildItem release-package/*.dll -ErrorAction SilentlyContinue).Count
        if ($dllCount -eq 0) {
          Write-Warning "⚠️ No DLL files found in package - game may not run!"
        } else {
          Write-Host "✅ Found $dllCount DLL files"
        }

        Write-Host "✅ Package verification passed"

    - name: Upload Windows Build
      uses: actions/upload-artifact@v4
      with:
        name: Frogger-Windows-x64
        path: release-package/
        if-no-files-found: error

    - name: Create ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path release-package/* -DestinationPath Frogger-Windows-x64.zip
        $zipSize = (Get-Item Frogger-Windows-x64.zip).Length / 1MB
        Write-Host "✅ Created ZIP archive ($([math]::Round($zipSize, 2)) MB)"

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Frogger-Windows-x64-ZIP
        path: Frogger-Windows-x64.zip
        if-no-files-found: error

  build-info:
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
    - name: Build Success
      run: |
        echo "✅ Windows build completed successfully!"
        echo "📦 Artifacts are ready for download"
        echo "🎮 Download Frogger-Windows-x64.zip to play!"
