name: Build Windows Release

on:
  push:
    branches: [ main, master, develop, claude/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ github.workspace }}/build/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
        cd ..

    - name: Configure CMake with vcpkg
      run: |
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build build --config Release

    - name: List build output
      run: |
        Write-Host "Build directory contents:"
        Get-ChildItem -Path build -Recurse -Filter "*.exe" | ForEach-Object { Write-Host $_.FullName }
        Get-ChildItem -Path build -Recurse -Filter "*.dll" | ForEach-Object { Write-Host $_.FullName }

    - name: Package artifacts
      run: |
        New-Item -ItemType Directory -Force -Path release-package
        Copy-Item build/Release/Frogger.exe release-package/ -ErrorAction Stop
        Copy-Item demo.jpg release-package/ -ErrorAction SilentlyContinue
        Copy-Item m0.png release-package/ -ErrorAction SilentlyContinue
        Copy-Item README.md release-package/

        # Copy all required DLLs from vcpkg_installed directory
        $vcpkgBinPath = "build/vcpkg_installed/x64-windows/bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg_installed..."
          Get-ChildItem "$vcpkgBinPath/*.dll" | ForEach-Object {
            Write-Host "Copying $($_.Name)"
            Copy-Item $_.FullName release-package/
          }
        }

        # Fallback: Check vcpkg directory
        $vcpkgInstalled = "vcpkg/installed/x64-windows/bin"
        if (Test-Path $vcpkgInstalled) {
          Write-Host "Copying DLLs from vcpkg/installed..."
          Get-ChildItem "$vcpkgInstalled/*.dll" | ForEach-Object {
            Write-Host "Copying $($_.Name)"
            Copy-Item $_.FullName release-package/ -Force
          }
        }

        # List what we packaged
        Write-Host "`nPackaged files:"
        Get-ChildItem release-package | ForEach-Object { Write-Host "  - $($_.Name)" }

    - name: Verify executable
      run: |
        if (Test-Path "release-package/Frogger.exe") {
          Write-Host "✅ Frogger.exe found"
          $dllCount = (Get-ChildItem release-package/*.dll).Count
          Write-Host "✅ Found $dllCount DLL files"
        } else {
          Write-Error "❌ Frogger.exe not found!"
          exit 1
        }

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Frogger-Windows-x64
        path: release-package/
        if-no-files-found: error

    - name: Create Release ZIP
      run: |
        Compress-Archive -Path release-package/* -DestinationPath Frogger-Windows-x64.zip

    - name: Upload Release ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Frogger-Windows-x64-ZIP
        path: Frogger-Windows-x64.zip
        if-no-files-found: error

  build-info:
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
    - name: Print Build Success
      run: |
        echo "✅ Windows build completed successfully!"
        echo "📦 Artifacts have been uploaded and are available for download."
        echo "🎮 Download the Frogger-Windows-x64.zip to play the game!"
